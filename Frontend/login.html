<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | USA</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <!-- LEFT SIDE -->
        <div class="auth-left">
            <div class="brand">
                <span>🛍️</span> Universal Shopping Assistant
            </div>

            <div class="welcome">
                <h1>Welcome Back!</h1>
                <p>
                    Your smart shopping assistant is ready to help you
                    discover better products and better deals.
                </p>
            </div>
        </div>


        <!-- RIGHT SIDE -->
        <div class="auth-right">

            <div class="auth-box">

                <h2>Welcome Back 👋</h2>
                <p class="subtitle">Login to continue shopping smarter.</p>

                <form id="loginForm">

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>

                        <div class="password-box">
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                onclick="togglePassword('password', this)"
                            >
                                👁
                            </button>
                        </div>
                    </div>

                    <div class="form-options">

                        <label class="remember">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>

                    <button type="submit" class="auth-btn">
                        Login
                    </button>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <button class="google-btn" type="button">
                    <span>G</span>
                    Continue with Google
                </button>


                <p class="switch-page">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
